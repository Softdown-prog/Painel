name: softload-panel
services:
  api:
    build: .
    image: softload-panel-api:1
    container_name: softload-panel-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      PANEL_EDGE_KEY_FILE: /run/secrets/panel-edge-key
      PANEL_DATA_DIR: /data
      SOFTLOAD_ENV_FILE: /host/softload.env
    volumes:
      - panel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/softload-panel/edge-key:/run/secrets/panel-edge-key:ro
      - /opt/softload-infra/softload/.env:/host/softload.env:ro
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 160m
    cpus: "0.5"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  panel_data:
    name: softload_panel_data
networks:
  proxy:
    external: true
    name: softload_proxy
