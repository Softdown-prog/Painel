# Opt-in staging frontend. Does not touch Caddy, Tunnel, the API or executor.
# Usage: docker compose -f compose.yaml -f compose.web.yaml up -d --no-deps panel-web
# A release must supply its pinned 40-character PANEL_WEB_REVISION.
services:
  panel-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        PANEL_WEB_REVISION: "${PANEL_WEB_REVISION:-0000000000000000000000000000000000000000}"
    image: "vps-panel-web:${PANEL_WEB_REVISION:-local}"
    container_name: softload-panel-web
    restart: unless-stopped
    environment:
      PORT: "8081"
      PANEL_STATIC_DIR: /app/public
      PANEL_EDGE_KEY_FILE: /run/secrets/panel-edge-key
      PANEL_PUBLIC_ORIGIN: "${PANEL_PUBLIC_ORIGIN:-https://panel.analysepro.com}"
      PANEL_WEB_REVISION: "${PANEL_WEB_REVISION:-development}"
    volumes:
      - /etc/softload-panel/edge-key:/run/secrets/panel-edge-key:ro
    networks:
      - proxy
    # Intentionally no public ports, no Docker socket, no project data volumes.
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Startup reads root-owned secret and immediately drops to the node user.
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/__panel_web_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
