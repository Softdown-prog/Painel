# Experimental isolated application gateway, NOT the existing softload-caddy.
# Existing Caddy must be manually attached to softload_panel_apps before routing. Do not attach this gateway to the production proxy network.
# Include only after provisioning DNS and explicit wildcard route in production Caddy.
# Generated routes require an operator-triggered caddy reload in this gateway.
services:
  api:
    environment:
      PANEL_DOMAINS_ENABLED: "${PANEL_DOMAINS_ENABLED:-0}"
      PANEL_APPS_DOMAIN_ZONE: "${PANEL_APPS_DOMAIN_ZONE:-}"
      PANEL_APPS_NETWORK: softload_panel_apps
  app-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./router/Caddyfile:/etc/caddy/Caddyfile:ro
      - panel_data:/config/panel:ro
    networks:
      - panel_apps
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:size=16m,mode=1777
      - /config/caddy:size=8m,mode=1777
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64
    # The official Caddy image carries a file capability. Dropping the whole
    # capability bounding set makes Linux reject the binary before it starts
    # (`exec ... operation not permitted`), even though this gateway listens
    # only on 8081. It has no Docker socket, no published port and a read-only
    # filesystem; keep the container isolated by network and filesystem here.
networks:
  panel_apps:
    name: softload_panel_apps
    driver: bridge
