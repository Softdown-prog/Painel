# One-time operator setup: mkdir -p /etc/softload-panel/managed-secrets;
# chown root:root /etc/softload-panel/managed-secrets; chmod 700 /etc/softload-panel/managed-secrets
# This bind mount writes files on the VPS. It DOES NOT restart applications or inject keys by itself.
# Enabled only after the operator reviews paths and mounts this overlay.
services:
  api:
    environment:
      PANEL_SECRETS_ENABLED: "${PANEL_SECRETS_ENABLED:-0}"
      PANEL_SECRETS_DIR: /run/panel-managed-secrets
    volumes:
      - /etc/softload-panel/managed-secrets:/run/panel-managed-secrets:rw
