name: Build and deploy Panel web staging via GHCR
on:
  push:
    branches: [main]
    paths:
      - 'angular/**'
      - 'web/**'
      - '*.ts'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'package.json'
      - 'scripts/version-pages-assets.mjs'
      - 'operations/driver.py'
      - 'operations/web.py'
      - 'operations/test_operations.py'
      - 'operations/policy.example.json'
      - '.github/workflows/deploy-panel-web.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: vps-project-panel-web
  cancel-in-progress: false

jobs:
  build:
    # Issues must have the exact title and the registered administrator identity.
    # The issue body/comments are NEVER interpreted as commands or input.
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main' && (github.event_name != 'issues' || (github.event.issue.user.id == 189416996 && github.event.issue.title == '[VPS] deploy panel-web'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test broker staging adapter and access boundaries
        run: |
          python3 -m pip install 'cryptography>=43,<50'
          python3 -m unittest discover -s operations -p 'test_*.py' -v
      - name: Build frontend on GitHub, not on the VPS
        run: docker build -f web/Dockerfile --build-arg PANEL_WEB_REVISION="$GITHUB_SHA" -t vps-panel-web:test .
      - name: Test Angular files, API cookie proxy and origin filtering
        run: bash web/ci-network-smoke.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable frontend image to GHCR
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            PANEL_WEB_REVISION=${{ github.sha }}
          tags: ghcr.io/softdown-prog/painel-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Softdown-prog/Painel
          cache-from: type=gha,scope=panel-web
          cache-to: type=gha,mode=max,scope=panel-web
      - name: Explain staging activation status
        env:
          STAGING_AUTO_DEPLOY: ${{ vars.PANEL_WEB_DEPLOY_ENABLED }}
        run: |
          if [[ "$STAGING_AUTO_DEPLOY" == "true" ]]; then
            echo 'Automatic isolated staging requested; the broker must already be authorized.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GHCR image built; VPS deployment requires one-time root bootstrap and PANEL_WEB_DEPLOY_ENABLED=true or workflow_dispatch.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PANEL_WEB_DEPLOY_ENABLED == 'true') || (github.event_name == 'issues' && github.event.issue.user.id == 189416996 && github.event.issue.title == '[VPS] deploy panel-web'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ONLY panel-web in private staging and verify live revision
        env:
          VPS_OPERATION: deploy
          VPS_PROJECT: panel-web
          VPS_IMAGES: '{"web":"ghcr.io/softdown-prog/painel-web@${{ needs.build.outputs.digest }}"}'
          VPS_SSH_KEY: ${{ secrets.VPS_OPERATIONS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_OPERATIONS_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 operations/client.py
      - name: Preserve sanitized live result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-web-staging-${{ github.sha }}
          path: vps-result.json
          if-no-files-found: warn
          retention-days: 30
