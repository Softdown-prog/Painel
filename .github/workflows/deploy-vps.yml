name: Deploy verified Panel backend to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vps-project-panel
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build:frontend && npm run check:js
      - name: Test broker authorization, isolation, replay and rollback
        run: |
          python3 -m pip install 'cryptography>=43,<50'
          python3 -m unittest discover -s operations -p 'test_*.py' -v
      - run: bash -n operations/install-vps.sh
      - name: Validate real Docker boundary
        run: |
          docker build -t vps-panel-api:smoke server
          docker build -f server/executor.Dockerfile -t vps-panel-executor:smoke server
          docker build -f web/Dockerfile --build-arg PANEL_WEB_REVISION="$GITHUB_SHA" -t vps-panel-web:test .
          bash web/ci-network-smoke.sh

  deploy:
    needs: verify
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable API image on GitHub
        id: api
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ghcr.io/softdown-prog/painel-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Softdown-prog/Painel
          cache-from: type=gha,scope=panel-api
          cache-to: type=gha,mode=max,scope=panel-api
      - name: Build immutable executor image on GitHub
        id: executor
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/executor.Dockerfile
          push: true
          tags: ghcr.io/softdown-prog/painel-executor:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Softdown-prog/Painel
          cache-from: type=gha,scope=panel-executor
          cache-to: type=gha,mode=max,scope=panel-executor
      - name: Install only Panel services, verify live SHA and roll back on failure
        env:
          VPS_OPERATION: deploy
          VPS_PROJECT: panel
          VPS_IMAGES: '{"api":"ghcr.io/softdown-prog/painel-api@${{ steps.api.outputs.digest }}","executor":"ghcr.io/softdown-prog/painel-executor@${{ steps.executor.outputs.digest }}"}'
          VPS_SSH_KEY: ${{ secrets.VPS_OPERATIONS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_OPERATIONS_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 operations/client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-vps-panel-${{ github.sha }}
          path: vps-result.json
          if-no-files-found: warn
          retention-days: 30
