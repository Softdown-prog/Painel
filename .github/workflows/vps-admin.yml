name: VPS admin (existing vpsops executor, root)
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Script bash para executar como root na VPS (sem prompt interativo)'
        required: true
        type: string
      publish_output:
        description: 'Publicar trecho do log no GitHub (CUIDADO: pode conter segredos)'
        required: false
        type: boolean
        default: false
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: vps-admin-operations
  cancel-in-progress: false

jobs:
  admin:
    # Only the registered owner can start the issue bridge. No PR/push event grants root.
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.id == 189416996 && github.event.issue.title == '[VPS] admin'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: vps-admin
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare request without executing command on runner
        env:
          ADMIN_COMMAND: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.command }}
          PUBLISH_OUTPUT: ${{ github.event_name == 'issues' && 'false' || inputs.publish_output }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          command=os.environ.get('ADMIN_COMMAND','')
          if not command.strip() or len(command.encode('utf-8'))>8192 or '\x00' in command:
              raise SystemExit('Invalid admin command')
          publish=os.environ.get('PUBLISH_OUTPUT','false').lower()=='true'
          dest=pathlib.Path('admin-request.json')
          dest.write_text(json.dumps({'command':command,'publish_output':publish}))
          dest.chmod(0o600)
          print('Administrative request prepared; command content not displayed.')
          PY
      - name: Execute via existing SSH/OIDC broker on VPS
        env:
          VPS_OPERATION: admin
          VPS_PROJECT: infrastructure
          VPS_ADMIN_REQUEST_FILE: admin-request.json
          VPS_SSH_KEY: ${{ secrets.VPS_OPERATIONS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_OPERATIONS_KNOWN_HOSTS }}
        run: python3 operations/client.py
      - name: Return sanitized result to admin issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('vps-result.json')
          result=json.loads(p.read_text()) if p.exists() else {'exitCode':1,'error':'No executor result'}
          result.pop('outputExcerpt',None)
          pathlib.Path('admin-result.md').write_text('Resultado do executor VPS (sem saída bruta)\n\x60\x60\x60json\n'+json.dumps(result,indent=2)+'\n\x60\x60\x60\n')
          PY
          gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file admin-result.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-admin-result-${{ github.run_id }}
          path: vps-result.json
          retention-days: 14
