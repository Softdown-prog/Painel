name: Rust runtime and Node contract
on:
  push:
    # Validation-only integration branch. No production deploy or VPS access.
    branches: [main, feat/angular-complete-migration]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build-only Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Validate formatting, lint and Rust tests without third-party crates
        working-directory: server/native-runtime
        run: |
          cargo +1.85.1 fmt --check
          cargo +1.85.1 clippy --locked --offline --all-targets -- -D warnings
          cargo +1.85.1 test --locked --offline
          cargo +1.85.1 build --release --locked --offline
      - name: Test real Rust/Node contracts, fallback, isolation and transport bounds
        env:
          PANEL_TEST_NATIVE_BINARY: ${{ github.workspace }}/server/native-runtime/target/release/panel-runtime
        run: node --experimental-strip-types --test server/native-runtime.test.mjs server/app-wake.test.mjs server/host-metrics.test.mjs
      - name: Build and boot restricted hybrid gateway
        run: |
          docker build -f server/app-wake.Dockerfile -t panel-wake:rust-test server
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 96m --cpus .25 --pids-limit 64 panel-wake:rust-test node native-runtime-smoke.mjs
