name: SAC-008B Actions job submission (offline)
on:
  pull_request:
  push:
    branches: ['feat/sac-008b-actions-queue']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<50'
      - run: |
          python -m py_compile operations/client.py operations/sac_submit.py operations/receiver.py
          python -m unittest discover -s operations -p 'test_sac_submit.py' -v
          python -m unittest discover -s operations -p 'test_sac_worker.py' -v
          python -m unittest discover -s operations -p 'test_mcp_query.py' -v
