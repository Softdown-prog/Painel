name: Console CI
on:
  push:
    branches: [main, 'feat/angular-complete-migration']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Test private VPS operations and project isolation
        run: |
          python3 -m pip install 'cryptography>=43,<50'
          python3 -m unittest discover -s operations -p 'test_*.py' -v
          bash -n operations/install-vps.sh
          bash -n operations/upgrade-vpsops-maintenance.sh
      - run: docker compose -f server/compose.yaml -f server/compose.web.yaml config --quiet
      - name: Enforce staging frontend isolation
        run: |
          docker compose -f server/compose.yaml -f server/compose.web.yaml config --format json | python3 -c '
          import json,sys
          c=json.load(sys.stdin);w=c["services"]["panel-web"]
          assert set(w["networks"])=={"proxy"}
          assert not w.get("ports")
          assert all("/var/run/docker.sock" not in v.get("source","") for v in w.get("volumes",[]))
          assert w["read_only"] and w["cap_drop"]==["ALL"]
          assert c["services"]["executor"]["network_mode"]=="none"
          assert "proxy" in c["services"]["api"]["networks"]
          print("PASS: frontend stays on private control network without Docker socket or public ports")
          '
      - run: bash -n web/deploy-staging-vps.sh && bash -n web/inspect-vps.sh && bash -n web/ci-network-smoke.sh
      - name: Build independent VPS frontend image
        run: docker build -f web/Dockerfile --build-arg PANEL_WEB_REVISION="$GITHUB_SHA" -t vps-panel-web:test .
      - name: Verify isolated HTTP API proxy, cookies and origin using Docker
        run: bash web/ci-network-smoke.sh
      - name: Boot frontend as an isolated restricted container
        run: |
          set -euo pipefail
          secret="$(mktemp)"
          trap 'docker rm -f panel-web-smoke >/dev/null 2>&1 || true; sudo rm -f "$secret"' EXIT
          printf '%s\n' "github-smoke-test-secret-at-least-32-characters" | sudo tee "$secret" >/dev/null
          sudo chown 0:0 "$secret"
          sudo chmod 600 "$secret"
          docker run -d --name panel-web-smoke --network none --read-only \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges \
            --mount "type=bind,src=$secret,dst=/run/secrets/panel-edge-key,readonly" \
            -e PANEL_PUBLIC_ORIGIN=https://panel.example.test vps-panel-web:test
          docker exec panel-web-smoke node -e '
            (async()=>{
              const r=await fetch("http://127.0.0.1:8081/");
              if(r.status!==200 || !(await r.text()).includes("<html"))process.exit(1);
              const angular=await fetch("http://127.0.0.1:8081/angular/");
              if(!angular.ok || !(await angular.text()).includes("panel-app"))process.exit(1);
              const h=await fetch("http://127.0.0.1:8081/__panel_web_health");
              if(!h.ok || !(await h.json()).ok)process.exit(1);
              console.log("PASS: root secret read, privilege drop and static files served");
            })().catch(()=>process.exit(1))
          '

      - run: docker compose -f server/compose.yaml -f server/compose.apps.yaml -f server/compose.routing.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.ssh-terminal.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.revisions.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.publications.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.secrets.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.legacy-softload.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.postgres.yaml config --quiet
      - name: Verify PostgreSQL overlay preserves Panel and DB networks
        run: |
          docker compose -f server/compose.yaml -f server/compose.postgres.yaml config --format json | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          api=data["services"]["api"]
          executor=data["services"]["executor"]
          assert set(api["networks"]) == {"proxy","postgres_shared"}, "API must keep the tunnel and DB networks"
          assert data["networks"]["proxy"]["name"] == "vps_panel_control"
          assert data["networks"]["postgres_shared"]["name"] == "vps_pg_private"
          assert data["networks"]["postgres_shared"]["external"] is True
          assert executor["network_mode"] == "none"
          assert api["environment"]["PANEL_POSTGRES_ENABLED"] == "1"
          assert not api.get("ports")
          print("PASS: PostgreSQL overlay preserves control plane and isolation")
          '
      - run: bash -n server/postgres-preflight-vps.sh
      - run: bash -n server/postgres-mtls-prepare-vps.sh
      - run: bash -n server/postgres-mtls-preflight-vps.sh
      - run: bash -n server/deploy-panel-api-postgres-vps.sh
      - run: bash -n server/build-panel-api-release-vps.sh
      - run: bash -n server/panel-api-deploy-check-vps.sh
      - run: docker compose -f server/tunnel.compose.yaml config --quiet
      - name: Verify independent control-plane configuration
        run: |
          docker compose -f server/compose.yaml config --format json | python3 -c '
          import json,sys
          c=json.load(sys.stdin); api=c["services"]["api"]; executor=c["services"]["executor"]
          assert c["networks"]["proxy"]["name"]=="vps_panel_control"
          assert not c["networks"]["proxy"].get("external",False)
          assert api["environment"]["PANEL_SOFTLOAD_LEGACY"]=="0"
          assert executor["environment"]["PANEL_SOFTLOAD_LEGACY"]=="0"
          assert not api.get("depends_on")
          assert not api.get("ports")
          assert all("/opt/softload-infra" not in v.get("source","") for v in api.get("volumes",[]))
          assert c["volumes"]["panel_data"]["name"]=="softload_panel_data"
          print("PASS: generic API has independent network and preserves existing data volume")
          '
          docker compose -f server/tunnel.compose.yaml config --format json | python3 -c '
          import json,sys
          c=json.load(sys.stdin)
          assert c["networks"]["proxy"]["name"]=="vps_panel_control"
          assert c["networks"]["proxy"]["external"] is True
          print("PASS: tunnel joins the administrative network owned by the Panel")
          '
      - run: bash -n server/preflight-vps.sh
      - run: bash -n server/diagnose-connection-vps.sh
      - run: npm run check:js
      - run: npm run build:frontend && node --check database-ui.js && node --check github-ui.js && node --check apps-ui.js && node --check projects-ui.js && node --check hosted-projects-ui.js && node --check domains-ui.js && node --check terminal-ui.js && node --check revisions-ui.js && node --check site-detail-ui.js && node --check secrets-ui.js
