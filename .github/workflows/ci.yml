name: Console CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: docker compose -f server/compose.yaml -f server/compose.apps.yaml -f server/compose.routing.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.ssh-terminal.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.revisions.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.publications.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.secrets.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.legacy-softload.yaml config --quiet
      - run: docker compose -f server/compose.yaml -f server/compose.postgres.yaml config --quiet
      - name: Verify PostgreSQL overlay preserves Panel and DB networks
        run: |
          docker compose -f server/compose.yaml -f server/compose.postgres.yaml config --format json | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          api=data["services"]["api"]
          executor=data["services"]["executor"]
          assert set(api["networks"]) == {"proxy","postgres_shared"}, "API must keep the tunnel and DB networks"
          assert data["networks"]["proxy"]["name"] == "vps_panel_control"
          assert data["networks"]["postgres_shared"]["name"] == "vps_pg_private"
          assert data["networks"]["postgres_shared"]["external"] is True
          assert executor["network_mode"] == "none"
          assert api["environment"]["PANEL_POSTGRES_ENABLED"] == "1"
          assert not api.get("ports")
          print("PASS: PostgreSQL overlay preserves control plane and isolation")
          '
      - run: bash -n server/postgres-preflight-vps.sh
      - run: bash -n server/deploy-panel-api-postgres-vps.sh
      - run: docker compose -f server/tunnel.compose.yaml config --quiet
      - name: Verify independent control-plane configuration
        run: |
          docker compose -f server/compose.yaml config --format json | python3 -c '
          import json,sys
          c=json.load(sys.stdin); api=c["services"]["api"]; executor=c["services"]["executor"]
          assert c["networks"]["proxy"]["name"]=="vps_panel_control"
          assert not c["networks"]["proxy"].get("external",False)
          assert api["environment"]["PANEL_SOFTLOAD_LEGACY"]=="0"
          assert executor["environment"]["PANEL_SOFTLOAD_LEGACY"]=="0"
          assert not api.get("depends_on")
          assert not api.get("ports")
          assert all("/opt/softload-infra" not in v.get("source","") for v in api.get("volumes",[]))
          assert c["volumes"]["panel_data"]["name"]=="softload_panel_data"
          print("PASS: generic API has independent network and preserves existing data volume")
          '
          docker compose -f server/tunnel.compose.yaml config --format json | python3 -c '
          import json,sys
          c=json.load(sys.stdin)
          assert c["networks"]["proxy"]["name"]=="vps_panel_control"
          assert c["networks"]["proxy"]["external"] is True
          print("PASS: tunnel joins the administrative network owned by the Panel")
          '
      - run: bash -n server/preflight-vps.sh
      - run: bash -n server/diagnose-connection-vps.sh
      - run: npm run check:js
      - run: npm run build:frontend && node --check database-ui.js && node --check github-ui.js && node --check apps-ui.js && node --check projects-ui.js && node --check hosted-projects-ui.js && node --check domains-ui.js && node --check terminal-ui.js && node --check revisions-ui.js && node --check site-detail-ui.js && node --check secrets-ui.js
