name: Diagnose MCP public HTTPS route (read-only)
on:
  push:
    branches: ['feat/angular-complete-migration']
    paths:
      - '.github/workflows/mcp-public-diagnostics.yml'
      - 'tools/repo-mcp/public-diagnostics.mjs'
      - 'tools/repo-mcp/public-diagnostics.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test response classification and no-secret behavior
        run: node --test tools/repo-mcp/public-diagnostics.test.mjs
      - name: Compare public MCP unauthenticated and invalid-token responses
        run: node tools/repo-mcp/public-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-public-diagnostic-${{ github.run_id }}
          path: mcp-public-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
