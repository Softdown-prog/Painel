name: Test, stage and optionally deploy pinned Codex bridge
on:
  pull_request:
    paths:
      - 'agents/**'
      - 'server/compose.agents.yaml'
      - 'operations/codex.py'
      - 'operations/install_codex.py'
      - 'operations/upgrade-vpsops-codex.sh'
      - 'operations/test_codex*.py'
      - '.github/workflows/stage-codex-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'server/compose.agents.yaml'
      - 'operations/codex.py'
      - 'operations/install_codex.py'
      - 'operations/upgrade-vpsops-codex.sh'
      - 'operations/test_codex*.py'
      - '.github/workflows/stage-codex-bridge.yml'
  workflow_dispatch:
    inputs:
      activate:
        type: boolean
        default: false
        description: 'Deploy somente Codex após autorização de host e revisão'
permissions:
  contents: read
  packages: write
concurrency:
  group: vps-panel-codex-immutable-rollout
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'Softdown-prog/Painel'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned test image with source revision label
        run: |
          docker build --build-arg PANEL_SOURCE_SHA="$GITHUB_SHA" -t panel-codex:stage agents
          test "$(docker image inspect panel-codex:stage --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect panel-codex:stage --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/Softdown-prog/Painel"
      - name: Enable restricted sandbox profile for CI only
        run: |
          if ! command -v apparmor_parser >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y apparmor
          fi
          sudo apparmor_parser -r agents/apparmor.profile
      - name: Run actual Codex bridge and isolation checks without credentials
        run: |
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf fake-bridge-key > "$key"
          chmod 444 "$key"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt apparmor=panel-codex \
            --security-opt "seccomp=$PWD/agents/seccomp.json" \
            --memory 384m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:uid=61110,gid=61110,size=64m,mode=1777 \
            --tmpfs /home/node/.codex:uid=61110,gid=61110,size=64m,mode=0700 \
            --tmpfs /workspace:uid=61110,gid=61110,size=16m,mode=0700 \
            --tmpfs /state:uid=61110,gid=61110,size=16m,mode=0700 \
            -v "$PWD/agents:/tests:ro" \
            -v "$key:/run/secrets/panel-agent-key:ro" \
            --entrypoint sh panel-codex:stage \
            -c 'node --test /tests/bridge.test.mjs /tests/operations.test.mjs /tests/telemetry.test.mjs /tests/workspaces.test.mjs && node /tests/workspace-mount-smoke.mjs && node /tests/sandbox-smoke.mjs'
      - name: Set up GHCR builder
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Authenticate only to push image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable staged agent image; do not deploy to VPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: agents
          push: true
          tags: ghcr.io/softdown-prog/painel-codex:${{ github.sha }}
          build-args: |
            PANEL_SOURCE_SHA=${{ github.sha }}
            CODEX_NPM_VERSION=0.167.0
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Softdown-prog/Painel
      - name: Report immutable digest and separate activation gate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "Codex image staged at ghcr.io/softdown-prog/painel-codex@${{ steps.publish.outputs.digest }}"
          echo "Staging never updates the host. Only the independent protected deploy job can install it."

  deploy:
    needs: stage
    # Default OFF: host policy, approved environment and explicit opt-in required.
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.activate == true) || (github.event_name == 'push' && vars.PANEL_CODEX_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    environment: vps-maintenance
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ONLY codex-agents using the approved VPS broker
        env:
          VPS_OPERATION: deploy
          VPS_PROJECT: panel-codex
          VPS_IMAGES: '{"codex-agents":"ghcr.io/softdown-prog/painel-codex@${{ needs.stage.outputs.digest }}"}'
          VPS_SSH_KEY: ${{ secrets.VPS_OPERATIONS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_OPERATIONS_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 operations/client.py
      - name: Preserve sanitized host receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-codex-rollout-${{ github.sha }}
          path: vps-result.json
          if-no-files-found: warn
          retention-days: 30
