name: VPS operations (authenticated private executor)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inventory, verify, mcp_query, sac_worker, sac_submit]
        default: inventory
      sac_project_id:
        type: string
        required: false
        description: 'ID de projeto pré-registrado no One Worker'
      sac_profile_id:
        type: string
        required: false
        description: 'Perfil Angular autorizado'
      sac_source_sha:
        type: string
        required: false
        description: 'SHA completo de commit solicitado'
      sac_job_id:
        type: string
        required: false
        description: 'ID exato do trabalho SAC (gha-<run>-<attempt>)'
      sac_action:
        type: choice
        options: [status, report, job]
        default: status
        description: 'Consulta somente leitura ao checkpoint/resumo do One Worker'
      project:
        type: choice
        options: [infrastructure, panel, panel-web, terrania]
        default: infrastructure
      mcp_request:
        description: 'JSON de consulta MCP somente leitura; ex. {"repo":"Painel","tool":"repo_find_files","query":"executor","limit":10}'
        type: string
      sha:
        description: Full installed commit expected for verify
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
concurrency:
  group: vps-operations-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  command:
    # Issue bridge lets the connected GitHub tool request ONLY a read-only inventory.
    # Creating an arbitrary issue/PR never grants a shell or deployment permission.
    if: github.repository == 'Softdown-prog/Painel' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.issue.user.id == 189416996 && (github.event.issue.title == '[VPS] inventory' || github.event.issue.title == '[VPS] mcp-query' || github.event.issue.title == '[VPS] sac-status' || github.event.issue.title == '[VPS] sac-report' || github.event.issue.title == '[VPS] sac-job' || github.event.issue.title == '[VPS] sac-submit')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute on the VPS (no dependency on Pages)
        env:
          VPS_OPERATION: ${{ github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-submit' && 'sac_submit' || github.event_name == 'issues' && (github.event.issue.title == '[VPS] sac-status' || github.event.issue.title == '[VPS] sac-report' || github.event.issue.title == '[VPS] sac-job') && 'sac_worker' || github.event_name == 'issues' && github.event.issue.title == '[VPS] mcp-query' && 'mcp_query' || inputs.operation || 'inventory' }}
          VPS_SAC_ARGS: ${{ github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-submit' && github.event.issue.body || '' }}
          VPS_SAC_PROJECT_ID: ${{ inputs.sac_project_id || '' }}
          VPS_SAC_PROFILE_ID: ${{ inputs.sac_profile_id || '' }}
          VPS_SAC_SOURCE_SHA: ${{ inputs.sac_source_sha || '' }}
          VPS_SAC_JOB_ID: ${{ github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-job' && github.event.issue.body || inputs.sac_job_id || '' }}
          VPS_SAC_ACTION: ${{ github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-job' && 'job' || github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-report' && 'report' || github.event_name == 'issues' && github.event.issue.title == '[VPS] sac-status' && 'status' || inputs.sac_action || '' }}
          VPS_MCP_ARGS: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.mcp_request || '' }}
          VPS_PROJECT: ${{ inputs.project || 'infrastructure' }}
          VPS_SHA: ${{ inputs.sha }}
          VPS_SSH_KEY: ${{ secrets.VPS_OPERATIONS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_OPERATIONS_KNOWN_HOSTS }}
        run: python3 operations/client.py
      - name: Return result to requesting issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 -c 'from pathlib import Path; p=Path("vps-result.json"); Path("result.md").write_text("Resultado real da VPS\n```json\n" + (p.read_text() if p.exists() else "{\"exitCode\":1,\"error\":\"No executor result\"}") + "\n```\n")'
          gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file result.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-operation-${{ github.run_id }}
          path: vps-result.json
          retention-days: 30
