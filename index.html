<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel VPS · Angular</title>
  <script>
    // Compatibility entrypoint only. There is ONE administrative UI: Angular.
    (() => {
      const raw = location.hash.startsWith('#/') ? location.hash.slice(2) : location.hash.slice(1);
      const [view, args] = raw.split('?');
      const known = new Set(['overview','containers','apps','projects','terminal','agents',
        'revisions','database','domains','traffic','secrets','settings','infrastructure','deployments']);
      const aliases = {deploys:'deployments',services:'containers',logs:'terminal'};
      const target = aliases[view] || view;
      let destination = known.has(target) ? target : 'overview';
      if (view === 'site') {
        const slug = new URLSearchParams(args || '').get('slug') || '';
        if (/^(?=.{2,40}$)[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))
          destination = 'site?slug=' + slug;
        else destination = 'apps';
      }
      location.replace('/angular/#' + destination);
    })();
  </script>
</head>
<body>
  <p>O Painel VPS usa uma única interface Angular. <a href="/angular/#overview">Abrir Painel VPS</a>.</p>
</body>
</html>
